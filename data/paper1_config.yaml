# Protocolo inicial del Paper 1. Estos valores son una propuesta auditable;
# deben congelarse/prerregistrarse antes del experimento confirmatorio.
n_agents: 200
max_steps: 500
convergence_tolerance: 1.0e-8
stable_steps_required: 5
initial_scenario: uniform
cluster_threshold: 0.05

signal_a: [0.10, 0.90]
signal_b: [0.90, 0.10]

# Una rejilla simple permite estudiar epsilon sin escoger solo un caso bonito.
epsilons: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40]

# Cada condición cambia únicamente los pesos de las señales.
conditions:
  - name: control_hk
    signal_a_weight: 0
    signal_b_weight: 0
  - name: one_signal_a
    signal_a_weight: 5
    signal_b_weight: 0
  - name: two_equal
    signal_a_weight: 5
    signal_b_weight: 5
  - name: a_stronger
    signal_a_weight: 10
    signal_b_weight: 5
  - name: b_stronger
    signal_a_weight: 5
    signal_b_weight: 10

# Cincuenta semillas por condición es el mínimo propuesto en el protocolo.
seeds:
  start: 1
  count: 50
